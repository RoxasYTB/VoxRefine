[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxrefine"
version = "0.2.0"
description = "Local voice cleanup and reproducible engine comparisons."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
gtcrn = ["numpy>=1.24", "onnxruntime>=1.17"]
bench = ["psutil>=5.9"]
ap-bwe = ["numpy>=1.24", "torch>=2.0", "torchaudio>=2.0", "matplotlib>=3.8"]

[project.scripts]
voxrefine = "voxrefine.cli:main"

[tool.setuptools.packages.find]
include = ["voxrefine*"]
