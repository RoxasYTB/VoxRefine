[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxrefine"
version = "0.2.0"
description = "Local voice cleanup and reproducible engine comparisons."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
voxrefine = "voxrefine.cli:main"

[tool.setuptools.packages.find]
include = ["voxrefine*"]
